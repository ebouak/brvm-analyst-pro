# ----------------------------------------------------------------
# 5. PARAMÈTRES PIPELINE
# ----------------------------------------------------------------
pipeline:
  frequence_rss_minutes: 30
  frequence_google_news_minutes: 45
  frequence_sites_societes_minutes: 120
  frequence_commodites_minutes: 60
  frequence_institutions_minutes: 180
  retention_jours: 90
  max_workers: 15
  timeout_seconds: 15
  user_agent: "WestBourse-Bot/3.0 (+https://westbourse.com/bot)"

  stockage:
    type: "sqlite"
    chemin: "./data/westbourse_veille.db"
    backup_json: "./data/backup/"

  output:
    chemin_json: "./output/feed.json"
    chemin_alertes: "./output/alertes.json"
    chemin_stats: "./output/stats.json"
    chemin_commodites: "./output/commodites.json"
    webhook_url: ""

  notifications:
    email: ""
    telegram_bot_token: ""
    telegram_chat_id: ""
