<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Niveau 2 — Analyse Fondamentale BRVM">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="55%" stop-color="#111927"/>
      <stop offset="100%" stop-color="#17202e"/>
    </linearGradient>
    <radialGradient id="glow2" cx="80%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#c59b27" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c59b27" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3be54"/>
      <stop offset="100%" stop-color="#a8811a"/>
    </linearGradient>
    <linearGradient id="emeraldBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c98d"/>
      <stop offset="100%" stop-color="#128058"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg2)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>

  <!-- Subtle architectural grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="680" y1="0" x2="680" y2="675"/>
    <line x1="940" y1="0" x2="940" y2="675"/>
  </g>

  <!-- Brand & Level pill -->
  <rect x="72" y="72" width="320" height="44" rx="22" fill="#c59b27" fill-opacity="0.14" stroke="#c59b27" stroke-opacity="0.45"/>
  <text x="96" y="100" fill="#e5c45f" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="1.6">NIVEAU 2 · INTERMÉDIAIRE</text>

  <!-- Main Heading -->
  <text x="72" y="210" fill="#f5f2eb" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="600">Analyse</text>
  <text x="72" y="284" fill="#e5c45f" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="600">Fondamentale</text>

  <text x="72" y="346" fill="#a8b3c7" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="24">États financiers SYSCOHADA révisés,</text>
  <text x="72" y="380" fill="#a8b3c7" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="24">banques UEMOA, multiples &amp; value traps.</text>

  <!-- Ratio KPI pills bottom-left -->
  <g transform="translate(72, 460)">
    <rect width="166" height="92" rx="14" fill="#151e2d" stroke="#28354a"/>
    <text x="20" y="34" fill="#8b97ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600">PER</text>
    <text x="20" y="70" fill="#f5f2eb" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Cours / BPA</text>

    <rect x="184" width="166" height="92" rx="14" fill="#151e2d" stroke="#28354a"/>
    <text x="204" y="34" fill="#8b97ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600">ROE</text>
    <text x="204" y="70" fill="#22c98d" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Rentabilité</text>

    <rect x="368" width="174" height="92" rx="14" fill="#151e2d" stroke="#28354a"/>
    <text x="388" y="34" fill="#8b97ad" font-family="system-ui, sans-serif" font-size="16" font-weight="600">BILAN</text>
    <text x="388" y="70" fill="#e5c45f" font-family="system-ui, sans-serif" font-size="28" font-weight="700">P/B &amp; Dette</text>
  </g>

  <!-- Right Panel: Balance sheet / Earnings chart card -->
  <g transform="translate(690, 96)">
    <rect width="438" height="482" rx="22" fill="#131b29" fill-opacity="0.92" stroke="#2a384e" stroke-width="1.5"/>
    <text x="32" y="48" fill="#f5f2eb" font-family="system-ui, sans-serif" font-size="20" font-weight="600">Comptes &amp; Multiples BRVM</text>
    <text x="32" y="76" fill="#7c89a0" font-family="system-ui, sans-serif" font-size="15">Résultat net vs Capitaux propres</text>

    <!-- Horizontal baseline -->
    <line x1="32" y1="360" x2="406" y2="360" stroke="#2f3f57" stroke-width="1.5"/>
    <line x1="32" y1="270" x2="406" y2="270" stroke="#233044" stroke-dasharray="4 6"/>
    <line x1="32" y1="180" x2="406" y2="180" stroke="#233044" stroke-dasharray="4 6"/>

    <!-- Bars -->
    <rect x="52" y="250" width="38" height="110" rx="6" fill="url(#goldBar)" opacity="0.82"/>
    <rect x="100" y="220" width="38" height="140" rx="6" fill="url(#emeraldBar)"/>

    <rect x="166" y="218" width="38" height="142" rx="6" fill="url(#goldBar)" opacity="0.88"/>
    <rect x="214" y="182" width="38" height="178" rx="6" fill="url(#emeraldBar)"/>

    <rect x="280" y="176" width="38" height="184" rx="6" fill="url(#goldBar)"/>
    <rect x="328" y="132" width="38" height="228" rx="6" fill="url(#emeraldBar)"/>

    <!-- Trend line overlay -->
    <polyline points="71,240 185,205 299,158 366,120" fill="none" stroke="#f5f2eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="71" cy="240" r="5" fill="#e5c45f"/>
    <circle cx="185" cy="205" r="5" fill="#e5c45f"/>
    <circle cx="299" cy="158" r="5" fill="#e5c45f"/>
    <circle cx="366" cy="120" r="6" fill="#22c98d" stroke="#f5f2eb" stroke-width="2"/>

    <!-- Footer tags inside panel -->
    <rect x="32" y="394" width="176" height="56" rx="12" fill="#0d131d" stroke="#243145"/>
    <text x="48" y="418" fill="#7c89a0" font-family="system-ui, sans-serif" font-size="13">18 LEÇONS · 15 SIMULATEURS</text>
    <text x="48" y="438" fill="#e5c45f" font-family="system-ui, sans-serif" font-size="15" font-weight="700">SYSCOHADA &amp; Bancaire</text>

    <rect x="224" y="394" width="182" height="56" rx="12" fill="#0d131d" stroke="#243145"/>
    <text x="240" y="418" fill="#7c89a0" font-family="system-ui, sans-serif" font-size="13">EXERCICES EN BASE</text>
    <text x="240" y="438" fill="#22c98d" font-family="system-ui, sans-serif" font-size="15" font-weight="700">PER &amp; Value Trap Live</text>
  </g>

  <text x="72" y="620" fill="#6f7c91" font-family="system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="1.2">WESTBOURSE ACADEMY</text>
</svg>
