<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Niveau 3 — Analyse Technique BRVM">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091015"/>
      <stop offset="55%" stop-color="#0e1922"/>
      <stop offset="100%" stop-color="#13222d"/>
    </linearGradient>
    <radialGradient id="glow3" cx="76%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#18a974" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#18a974" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c98d" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#22c98d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg3)"/>
  <rect width="1200" height="675" fill="url(#glow3)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Pill -->
  <rect x="72" y="72" width="268" height="44" rx="22" fill="#18a974" fill-opacity="0.16" stroke="#22c98d" stroke-opacity="0.5"/>
  <text x="96" y="100" fill="#46dca4" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="1.6">NIVEAU 3 · AVANCÉ</text>

  <!-- Title -->
  <text x="72" y="210" fill="#f5f2eb" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="600">Analyse</text>
  <text x="72" y="284" fill="#46dca4" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="600">Technique</text>

  <text x="72" y="346" fill="#a8b8c4" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="24">Chandeliers japonais, MM20 / MM50,</text>
  <text x="72" y="380" fill="#a8b8c4" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="24">RSI(14), MACD 12/26/9 &amp; gestion du risque.</text>

  <!-- Indicator tags -->
  <g transform="translate(72, 460)">
    <rect width="160" height="92" rx="14" fill="#111d27" stroke="#233847"/>
    <text x="20" y="34" fill="#7f95a6" font-family="system-ui, sans-serif" font-size="16" font-weight="600">TENDANCE</text>
    <text x="20" y="70" fill="#e5c45f" font-family="system-ui, sans-serif" font-size="26" font-weight="700">MM20 / 50</text>

    <rect x="178" width="166" height="92" rx="14" fill="#111d27" stroke="#233847"/>
    <text x="198" y="34" fill="#7f95a6" font-family="system-ui, sans-serif" font-size="16" font-weight="600">OSCILLATEUR</text>
    <text x="198" y="70" fill="#46dca4" font-family="system-ui, sans-serif" font-size="26" font-weight="700">RSI &amp; MACD</text>

    <rect x="362" width="180" height="92" rx="14" fill="#111d27" stroke="#233847"/>
    <text x="382" y="34" fill="#7f95a6" font-family="system-ui, sans-serif" font-size="16" font-weight="600">DISCIPLINE</text>
    <text x="382" y="70" fill="#f5f2eb" font-family="system-ui, sans-serif" font-size="26" font-weight="700">Stop &amp; Taille</text>
  </g>

  <!-- Right Panel: Candlestick & Moving Averages -->
  <g transform="translate(684, 88)">
    <rect width="444" height="498" rx="22" fill="#0d1720" fill-opacity="0.94" stroke="#223747" stroke-width="1.5"/>
    <text x="30" y="46" fill="#f5f2eb" font-family="system-ui, sans-serif" font-size="20" font-weight="600">Cote BRVM · Chandeliers &amp; RSI</text>
    <text x="30" y="72" fill="#768d9e" font-family="system-ui, sans-serif" font-size="15">Séances réelles · MM20 or · MM50 vert</text>

    <!-- Chart Grid -->
    <line x1="30" y1="120" x2="414" y2="120" stroke="#1b2d3b"/>
    <line x1="30" y1="200" x2="414" y2="200" stroke="#1b2d3b"/>
    <line x1="30" y1="280" x2="414" y2="280" stroke="#1b2d3b"/>
    <line x1="30" y1="345" x2="414" y2="345" stroke="#243a4b"/>

    <!-- Candlesticks -->
    <!-- Bullish candles #22c98d, Bearish #e55c5c -->
    <g stroke-width="2.5">
      <line x1="58" y1="238" x2="58" y2="298" stroke="#22c98d"/>
      <rect x="49" y="252" width="18" height="34" rx="2" fill="#22c98d"/>

      <line x1="94" y1="215" x2="94" y2="275" stroke="#22c98d"/>
      <rect x="85" y="226" width="18" height="34" rx="2" fill="#22c98d"/>

      <line x1="130" y1="220" x2="130" y2="268" stroke="#e55c5c"/>
      <rect x="121" y="232" width="18" height="24" rx="2" fill="#e55c5c"/>

      <line x1="166" y1="196" x2="166" y2="254" stroke="#22c98d"/>
      <rect x="157" y="206" width="18" height="34" rx="2" fill="#22c98d"/>

      <line x1="202" y1="184" x2="202" y2="240" stroke="#22c98d"/>
      <rect x="193" y="194" width="18" height="32" rx="2" fill="#22c98d"/>

      <line x1="238" y1="192" x2="238" y2="244" stroke="#e55c5c"/>
      <rect x="229" y="202" width="18" height="28" rx="2" fill="#e55c5c"/>

      <line x1="274" y1="164" x2="274" y2="225" stroke="#22c98d"/>
      <rect x="265" y="176" width="18" height="36" rx="2" fill="#22c98d"/>

      <line x1="310" y1="142" x2="310" y2="202" stroke="#22c98d"/>
      <rect x="301" y="154" width="18" height="34" rx="2" fill="#22c98d"/>

      <line x1="346" y1="148" x2="346" y2="195" stroke="#e55c5c"/>
      <rect x="337" y="158" width="18" height="22" rx="2" fill="#e55c5c"/>

      <line x1="382" y1="118" x2="382" y2="180" stroke="#22c98d"/>
      <rect x="373" y="128" width="18" height="38" rx="2" fill="#22c98d"/>
    </g>

    <!-- Moving averages -->
    <path d="M46 276 Q 130 250, 210 222 T 396 154" fill="none" stroke="#e5c45f" stroke-width="3" stroke-linecap="round"/>
    <path d="M46 296 Q 150 282, 240 256 T 396 196" fill="none" stroke="#46dca4" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>

    <!-- RSI bottom subchart -->
    <rect x="30" y="366" width="384" height="104" rx="12" fill="#091118" stroke="#1e3140"/>
    <line x1="30" y1="392" x2="414" y2="392" stroke="#e55c5c" stroke-opacity="0.35" stroke-dasharray="4 4"/>
    <line x1="30" y1="444" x2="414" y2="444" stroke="#22c98d" stroke-opacity="0.35" stroke-dasharray="4 4"/>
    <text x="42" y="386" fill="#768d9e" font-family="system-ui, sans-serif" font-size="12" font-weight="600">RSI(14) · 70 / 30</text>
    <polyline points="46,434 94,424 130,430 166,412 202,402 238,415 274,398 310,384 346,396 382,380 402,382" fill="none" stroke="#e5c45f" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <text x="72" y="620" fill="#6f8496" font-family="system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="1.2">WESTBOURSE ACADEMY</text>
</svg>
