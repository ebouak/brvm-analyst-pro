name: Enrichissement quotidien BRVM

# Étiquette le déclencheur pour le monitoring scraper_runs (schedule → cron).
env:
  SCRAPER_TRIGGER: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}

# Tourne à l'ouverture et à la fermeture de la séance BRVM (heure UTC = Abidjan).
# - Détail de cotation Sika (ouverture, +haut, +bas, beta, valorisation, capital)
# - Actualités (Sika Finance + brvm.org officiel + cosumaf)
# - Secteurs (référentiel ICB BRVM, idempotent)
on:
  schedule:
    - cron: '15 9 * * 1-5'   # ouverture ~09:15 UTC
    - cron: '0 16 * * 1-5'   # fermeture ~16:00 UTC
  workflow_dispatch: {}      # déclenchement manuel

concurrency:
  group: daily-enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NODE_TLS_REJECT_UNAUTHORIZED: '0' # brvm.org a une chaîne TLS incomplète
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install scraper deps
        working-directory: scraper
        run: npm install
      - name: Secteurs (référentiel)
        working-directory: scraper
        run: npx tsx src/index.ts secteurs
      - name: Nombre de titres (brvm.org capitalisations)
        working-directory: scraper
        run: npx tsx src/index.ts shares
        continue-on-error: true
      - name: Détail cotation (Sika)
        working-directory: scraper
        run: npx tsx src/index.ts cotations
      - name: Actualités (Sika + brvm.org + cosumaf)
        working-directory: scraper
        run: npx tsx src/index.ts news
      - name: Obligations (Sika Finance — taux fixes + variables)
        working-directory: scraper
        run: npx tsx src/index.ts obligations
        continue-on-error: true
      - name: Matières premières (World Bank Pink Sheet — mensuel, idempotent)
        working-directory: scraper
        run: npx tsx src/index.ts commodities
        continue-on-error: true
      - name: Dividendes (Sika Finance — idempotent)
        working-directory: scraper
        run: npx tsx src/index.ts dividends
        continue-on-error: true

      # Brief quotidien : idempotent (skip si déjà envoyé pour la séance).
      # Envoyé après la fermeture (run 16h) ; no-op au run d'ouverture.
      - name: Brief de séance (Telegram + WhatsApp + archive)
        working-directory: scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # WhatsApp (Meta Cloud API) — facultatif : sans ces secrets, canal ignoré.
          # Activation : voir docs/WHATSAPP.md.
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          # Brief AUDIO — cascade OpenAI (payant) -> Google Cloud (gratuit <=1M car/mois)
          # -> edge-tts (gratuit, sans cle, toujours actif). Chaque cle est facultative.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: npx tsx src/index.ts brief

      # Brief WhatsApp par utilisateur (opt-ins notification_prefs).
      # Idempotent (notifications_log). Sans secrets Meta : 0 envoi, jamais bloquant.
      - name: Brief WhatsApp (opt-ins utilisateurs)
        working-directory: scraper
        continue-on-error: true
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
        run: npx tsx src/index.ts brief:whatsapp --trigger=cron
