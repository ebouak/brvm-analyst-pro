name: Daily BRVM Scrape

on:
  schedule:
    # 09:15 UTC (market open ~09:30 Abidjan)
    - cron: '15 9 * * 1-5'
    # 16:00 UTC (market close ~16:00 Abidjan)
    - cron: '0 16 * * 1-5'
  workflow_dispatch: {}

# Jeton GITHUB_TOKEN réduit au minimum : ce workflow ne fait que lire le dépôt.
permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BDFIN_USERNAME: ${{ secrets.BDFIN_USERNAME }}
      BDFIN_PASSWORD: ${{ secrets.BDFIN_PASSWORD }}
      BDFIN_BASE_URL: https://bdfin.brvm.org
      BDFIN_LOGIN_PATH: /login.aspx
      BDFIN_MARKET_PATH: /ActivityMarket.aspx
      HTTP_TIMEOUT_MS: 30000
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Run daily full scrape (with retry)
        working-directory: scraper
        run: |
          MAX_RETRIES=2
          RETRY_DELAY=60
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES..."
            if npm run daily:full; then
              echo "✅ Daily full scrape succeeded"
              exit 0
            else
              if [ $attempt -lt $MAX_RETRIES ]; then
                echo "⚠️ Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            fi
          done
          echo "❌ Daily full scrape failed after $MAX_RETRIES attempts"
          exit 1

      # Lancé même si la collecte a échoué : c'est précisément le cas où la
      # séance manque. Au passage de clôture (16:00 UTC) d'un jour de séance,
      # une séance absente déclenche l'alerte CRITIQUE (Telegram + appel vocal
      # via /api/voix/alerte, une fois par fenêtre de 6 h).
      - name: Verify data was inserted
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VOIX_ALERTE_URL: ${{ vars.VOIX_ALERTE_URL }}
          VOIX_ALERTE_SECRET: ${{ secrets.VOIX_ALERTE_SECRET }}
        if: ${{ !cancelled() }}
        run: npx tsx scripts/verify-data.ts daily

      - name: Notify failure on Slack (optional)
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            SCHEDULE_TIME=$(date -u +'%H:%M UTC')
            curl -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"⚠️ Daily BRVM scrape FAILED at $SCHEDULE_TIME. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi

      - name: Notifier l'orchestrateur Ops
        if: always() && secrets.OPS_CALLBACK_SECRET != ''
        env:
          OPS_CALLBACK_SECRET: ${{ secrets.OPS_CALLBACK_SECRET }}
        run: |
          curl -fsS -X POST "https://www.westbourse.com/api/ops/callback" \
            -H "Authorization: Bearer ${OPS_CALLBACK_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"workflow\":\"daily-brvm.yml\",\"conclusion\":\"${{ job.status }}\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
