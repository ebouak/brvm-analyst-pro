name: Tests e2e (Playwright)

# Tests « smoke » des parcours critiques sur un build de production.
# Manuel uniquement tant que l'install Playwright n'est pas finalisée (évite des
# échecs rouges à chaque push). Réactiver le bloc `push:` une fois Playwright prêt.
on:
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install deps
        run: npm install
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
      - name: Build
        run: npm run build
      - name: Run e2e
        run: npm run e2e
