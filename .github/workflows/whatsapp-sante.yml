name: Santé de la passerelle WhatsApp

env:
  SCRAPER_TRIGGER: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}

# Toutes les heures de 06:00 à 22:00 UTC : la session WAHA (serveur
# westbourse-wa) doit être WORKING. Couvre le cas que le webhook ne peut pas
# signaler : WAHA ou le serveur arrêté (plus aucun webhook = faux silence).
# Panne → Telegram exploitant + run ROUGE. Spec : docs/superpowers/specs/2026-10-23-whatsapp-passerelle-design.md
on:
  schedule:
    - cron: '0 6-22 * * *'
  workflow_dispatch: {}

concurrency:
  group: whatsapp-sante
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sante:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install scraper deps
        working-directory: scraper
        run: npm install
      - name: Vérifier la session WhatsApp
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WAHA_URL: ${{ secrets.WAHA_URL }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_LEVEL: info
        run: npx tsx src/index.ts whatsapp:sante
