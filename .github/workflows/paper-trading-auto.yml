name: Paper Trading Auto (Open Positions)

# Run daily after market data is available (10:00 UTC, after daily:full at 09:15)
on:
  schedule:
    # 10:00 UTC weekdays (after daily:full scrape completes)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  auto_open:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LOG_LEVEL: info
      NODE_TLS_REJECT_UNAUTHORIZED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Auto-open positions from today's signals
        working-directory: scraper
        run: npm run paper-trading:auto

      - name: Verify positions were opened
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx tsx -e "
          import { createClient } from '@supabase/supabase-js';
          const client = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY);
          const today = new Date().toISOString().split('T')[0];

          const { count } = await client
            .from('paper_trading_positions')
            .select('*', { count: 'exact', head: true })
            .eq('entry_date', today)
            .eq('status', 'open');

          if ((count || 0) > 0) {
            console.log(\`✅ \${count} positions opened today\`);
          } else {
            console.log('ℹ️ No positions opened today (no strong signals or all accounts inactive)');
          }
          "

      - name: Notify failure on Slack (optional)
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"⚠️ Paper trading auto-open FAILED. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
