name: Paper Trading Auto (Open Positions)

# Run daily after market data is available (10:00 UTC, after daily:full at 09:15)
on:
  schedule:
    # 10:00 UTC weekdays (after daily:full scrape completes)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  auto_open:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LOG_LEVEL: info
      NODE_TLS_REJECT_UNAUTHORIZED: 0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm install

      - name: Auto-open positions from today's signals
        working-directory: scraper
        run: npm run paper-trading:auto

      - name: Verify positions were opened
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/verify-data.ts paper

      - name: Notify failure on Slack (optional)
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"⚠️ Paper trading auto-open FAILED. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
