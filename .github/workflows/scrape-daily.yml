name: BRVM Scraping Quotidien

on:
  schedule:
    # 18h30 UTC = 18h30 GMT = après clôture BRVM (lun-ven)
    - cron: '30 18 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date à scraper (YYYY-MM-DD), vide = séance courante'
        required: false

jobs:
  scrape:
    name: Scrape + Score BRVM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Installer les dépendances
        run: cd scraper && npm ci

      - name: Scraper la séance
        run: |
          cd scraper
          if [ -n "${{ inputs.date }}" ]; then
            npm run scrape:date -- "${{ inputs.date }}"
          else
            npm run scrape:daily
          fi
        env:
          BDFIN_BASE_URL: ${{ secrets.BDFIN_BASE_URL }}
          BDFIN_USERNAME: ${{ secrets.BDFIN_USERNAME }}
          BDFIN_PASSWORD: ${{ secrets.BDFIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Calculer les signaux
        run: cd scraper && npm run score
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
