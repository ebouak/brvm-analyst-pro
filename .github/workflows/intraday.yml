name: Cours intraday BRVM

# Étiquette le déclencheur pour le monitoring scraper_runs (schedule → cron).
env:
  SCRAPER_TRIGGER: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}

on:
  schedule:
    # Séance BRVM ~09:00–15:00 GMT (Abidjan = UTC). Lun-ven.
    # Deux séries décalées hors du top-of-hour (:00/:15/:30/:45 sont les minutes
    # les plus congestionnées chez GitHub → ticks souvent retardés ou SAUTÉS).
    # Résultat : ~un déclenchement toutes les 7-8 min. Les runs sont idempotents
    # et protégés par `concurrency`, donc le doublon éventuel est sans risque et
    # couvre la perte d'un tick planifié.
    - cron: '3,18,33,48 9-15 * * 1-5'
    - cron: '10,25,40,55 9-15 * * 1-5'
  workflow_dispatch: {} # déclenchement manuel possible

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install scraper deps
        working-directory: scraper
        run: npm install

      - name: Run intraday (with retry)
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=30
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES..."
            if npm run intraday; then
              echo "✅ Intraday scrape succeeded"
              exit 0
            else
              if [ $attempt -lt $MAX_RETRIES ]; then
                echo "⚠️ Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            fi
          done
          echo "❌ Intraday scrape failed after $MAX_RETRIES attempts"
          exit 1

      - name: Check data freshness
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        if: success()
        run: npx tsx scripts/verify-data.ts intraday

      - name: Notify failure on Slack (optional)
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"⚠️ Intraday scrape FAILED after 3 retries at $(date -u +'%H:%M UTC'). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
