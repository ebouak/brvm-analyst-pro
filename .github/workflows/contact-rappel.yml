name: Relance des messages de contact

env:
  SCRAPER_TRIGGER: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}

# Chaque jour ouvré à 07:00 et 14:00 UTC : Telegram exploitant si une demande
# attend une réponse depuis plus d'un jour ouvré, si une réponse n'est PAS
# ARRIVÉE (rejetée / spam, statut reçu par webhook Resend), si une remise reste
# non confirmée après 24 h (webhook muet) ou si un envoi est resté bloqué.
# Au 2026-10-21, 4 visiteurs sur 7 n'avaient jamais été répondus et rien ne le
# signalait.
# Le run ÉCHOUE si la table est illisible ou si la relance ne part pas.
on:
  schedule:
    - cron: '0 7 * * 1-5'
    # Second passage : une réponse rejetée le matin est signalée le jour même.
    - cron: '0 14 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: contact-rappel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rappel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install scraper deps
        working-directory: scraper
        run: npm install
      - name: Relancer les messages en attente
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_LEVEL: info
        run: npx tsx src/index.ts contact:rappel
