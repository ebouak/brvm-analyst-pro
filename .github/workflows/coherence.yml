name: Coherence Hebdomadaire

env:
  SCRAPER_TRIGGER: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}

on:
  schedule:
    # Dimanche 08:00 UTC : après les jobs de la semaine (score, liquidity,
    # dividends, carnet), avant le début de la suivante.
    - cron: '0 8 * * 0'
  workflow_dispatch: {}

concurrency:
  group: coherence
  cancel-in-progress: false

# Jeton GITHUB_TOKEN réduit au minimum : ce workflow ne fait que lire le dépôt.
permissions:
  contents: read

jobs:
  coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install scraper deps
        working-directory: scraper
        run: npm install

      - name: Run coherence scan with retry
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOG_LEVEL: info
        run: |
          MAX_RETRIES=2
          RETRY_DELAY=30
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES..."
            if npm run coherence; then
              echo "✅ Coherence scan succeeded"
              exit 0
            else
              if [ $attempt -lt $MAX_RETRIES ]; then
                echo "⚠️ Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            fi
          done
          echo "❌ Coherence scan failed after $MAX_RETRIES attempts"
          exit 1

      - name: Notify failure on Slack
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"⚠️ Coherence Hebdomadaire FAILED after 2 retries at $(date -u +'%H:%M UTC'). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
