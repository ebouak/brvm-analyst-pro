name: Deploy Frontend to Vercel

# Déclenchement manuel uniquement : le déploiement de prod passe par le Vercel
# Deploy Hook (sans VERCEL_TOKEN). Pour réactiver le déploiement CLI sur push,
# régénérer le secret GitHub VERCEL_TOKEN puis remettre le bloc `push:` ci-dessous.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (Production)
        # Pas de working-directory : le projet Vercel a deja "Root Directory = frontend"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
