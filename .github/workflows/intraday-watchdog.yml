name: Intraday Watchdog (Catch-up)

# Run every 30 minutes to check if intraday scrape is up-to-date
on:
  schedule:
    # Borné à la séance (intraday tourne 9h-15h45) : après la clôture les
    # données sont légitimement "stale", inutile de redéclencher.
    - cron: '*/30 9-15 * * 1-5'
  workflow_dispatch:

# Requis pour déclencher intraday.yml via createWorkflowDispatch
permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install scraper deps
        working-directory: scraper
        run: npm install

      - name: Check intraday data freshness
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        id: check
        run: npx tsx scripts/verify-data.ts watchdog

      - name: Trigger intraday catch-up
        if: steps.check.outputs.needsRetrigger == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            console.log('🔄 Triggering intraday catch-up workflow...');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'intraday.yml',
              ref: 'main'
            });
            console.log('✅ Catch-up workflow triggered');

      - name: Notify Slack if stale
        if: steps.check.outputs.needsRetrigger == 'true'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"⚠️ Intraday data is stale (>20 min). Catch-up triggered. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
