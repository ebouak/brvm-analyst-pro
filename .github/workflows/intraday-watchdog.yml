name: Intraday Watchdog (Catch-up)

# Run every 30 minutes to check if intraday scrape is up-to-date
on:
  schedule:
    # Borné à la séance (intraday tourne 9h-15h45) : après la clôture les
    # données sont légitimement "stale", inutile de redéclencher.
    # Minutes décalées (:13/:43) hors du top/half-of-hour congestionné, sinon
    # le watchdog lui-même est sujet aux ticks `schedule` sautés par GitHub.
    - cron: '13,43 9-15 * * 1-5'
  workflow_dispatch:

# Requis pour déclencher intraday.yml via createWorkflowDispatch
permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install scraper deps
        working-directory: scraper
        run: npm install

      - name: Check intraday data freshness
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        id: check
        run: npx tsx scripts/verify-data.ts watchdog

      - name: Trigger intraday catch-up
        if: steps.check.outputs.needsRetrigger == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            console.log('🔄 Triggering intraday catch-up workflow...');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'intraday.yml',
              ref: 'main'
            });
            console.log('✅ Catch-up workflow triggered');

      # Rendre la panne VISIBLE. Jusqu'ici ce workflow restait vert même avec des
      # cours périmés : l'alerte Slack ci-dessous n'a jamais eu de destination
      # (secret SLACK_WEBHOOK absent). Un run rouge, lui, est notifié par GitHub.
      - name: Échouer si les cours intraday sont périmés
        if: steps.check.outputs.stale == 'true'
        run: |
          echo "::error::Cours intraday périmés en séance (voir l'étape de contrôle). Rattrapage déclenché ; si l'alerte se répète, vérifier le déclencheur pg_cron (secret Vault github_pat_brvm)."
          exit 1

      - name: Notify Slack if stale
        if: steps.check.outputs.needsRetrigger == 'true'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"⚠️ Intraday data is stale (>20 min). Catch-up triggered. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
