name: CI — build & tests

# Garde-fou anti-régression : lance typecheck + build (frontend) et
# typecheck + tests (scraper) sur chaque push/PR vers main. Objectif : bloquer
# un build cassé (ex. module_not_found, erreur d'export de route) AVANT qu'il
# n'atteigne Vercel. Le `next build` reproduit fidèlement le build Vercel (mêmes
# variables publiques), donc il capte les erreurs que `tsc` seul ne voit pas.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un seul run par ref à la fois : un nouveau push annule le précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (Next.js)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Sentry désactivé en CI (pas d'upload de source maps sans token).
          SENTRY_AUTH_TOKEN: ''
        run: npm run build

  scraper:
    name: Scraper — typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (vitest)
        run: npm test
