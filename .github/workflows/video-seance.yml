name: Vidéo de séance

# Génère la vidéo verticale de la séance BRVM depuis Supabase, puis la publie
# sur Facebook et TikTok. Les deux étapes sont séparées : une génération réussie
# reste récupérable en artefact même si une plateforme refuse l'envoi.
#
# Secrets requis pour la génération : SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
# Secrets de publication (facultatifs, voir video/README.md) : FB_PAGE_ID,
# FB_PAGE_ACCESS_TOKEN, TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET,
# TIKTOK_REFRESH_TOKEN. Une plateforme non configurée est ignorée, pas en échec.

on:
  schedule:
    # 16:45 UTC du lundi au vendredi.
    #
    # Pourquoi cette heure, et pas 18:00 comme auparavant :
    #   · la BRVM clôture vers 15:00 UTC ;
    #   · daily.yml et score.yml consolident cours et signaux à 16:00 ;
    #   · alerts.yml part à 16:30, et le point de clôture qui suit annonce
    #     combien d'alertes se sont déclenchées — il doit donc passer après.
    # À 18:00, la vidéo arrivait deux heures après la consolidation, et EN MÊME
    # TEMPS que scrape-daily : deux workflows sur les mêmes tables.
    - cron: '45 16 * * 1-5'
  workflow_dispatch:
    inputs:
      publier:
        description: 'Publier sur Facebook et TikTok (sinon génération seule)'
        type: boolean
        default: true

concurrency:
  group: video-seance
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: video
    env:
      # Sortie hors de gan-harness/, qui n'est pas versionné et n'existe pas ici.
      VIDEO_OUT: ${{ github.workspace }}/video-out

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer ffmpeg et les polices
        # ffmpeg est présent sur l'image du runner, mais on ne le suppose pas.
        # Les polices comptent : le rendu se fait dans un navigateur, et sans
        # elles Chromium retomberait sur une fonte de secours étroite.
        run: |
          ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: Installer edge-tts
        run: python -m pip install --quiet edge-tts

      - name: Installer les dépendances
        run: npm install

      - name: Installer Chromium
        run: npx playwright install chromium --with-deps

      - name: Générer la vidéo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node genere.mjs

      - name: Publier sur la landing, Facebook et TikTok
        id: publier
        if: github.event_name == 'schedule' || inputs.publier
        env:
          # Indispensables : c'est par elles que la vidéo est hébergée dans le
          # bucket public `seance-video`, que lit la landing. Sans elles cette
          # étape se limiterait aux réseaux sociaux et le site ne verrait rien.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_BROUILLON: ${{ vars.FB_BROUILLON }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
          # Notification du soir. Le mode TikTok « inbox » dépose un brouillon
          # qu'il faut valider à la main : sans ce rappel, le geste serait
          # oublié et le mode brouillon ne tiendrait pas.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Canal PUBLIC de diffusion — distinct de TELEGRAM_CHAT_ID, qui est la
          # conversation privée d'exploitation. Variable et non secret : un nom
          # de canal public n'a rien à cacher, et le voir dans les journaux aide
          # au diagnostic.
          TELEGRAM_CANAL: ${{ vars.TELEGRAM_CANAL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_EMAIL_FROM: ${{ secrets.ALERTS_EMAIL_FROM }}
          ALERTS_EMAIL_TO: ${{ secrets.ALERTS_EMAIL_TO }}
        run: node publie.mjs

      # Point de clôture privé, APRÈS la publication de la vidéo : il réutilise
      # son file_id pour l'adresser à chaque abonné sans la re-téléverser.
      # Voir docs/superpowers/specs/2026-09-08-cloture-telegram-design.md.
      - name: Point de clôture Telegram
        if: github.event_name == 'schedule' || inputs.publier
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Vide si la publication dans le canal a échoué : le point de clôture
          # part alors sans la vidéo, plutôt que pas du tout.
          TELEGRAM_VIDEO_FILE_ID: ${{ steps.publier.outputs.video_file_id }}
          LOG_LEVEL: info
        run: |
          npm install --no-audit --no-fund
          npx tsx src/index.ts cloture

      - name: Conserver la vidéo
        # always() : une vidéo correcte refusée par une plateforme reste
        # téléchargeable et publiable à la main.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seance-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/video-out/westbourse-seance.mp4
            ${{ github.workspace }}/video-out/seance.json
            ${{ github.workspace }}/video-out/texte.txt
          retention-days: 14
          if-no-files-found: warn
