name: Indices pan-africains (AFX)

# Étiquette le déclencheur pour le monitoring scraper_runs (schedule → cron).
env:
  SCRAPER_TRIGGER: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}

on:
  # ── PLANIFICATION COUPÉE LE 2026-09-24, ET POURQUOI ─────────────────────
  # 136 exécutions, 136 échecs depuis le 04/07/2026. Toutes identiques :
  # UND_ERR_CONNECT_TIMEOUT sur les SIX adresses d'afx.kwayisi.org (4 en v4,
  # 2 en v6), pour les trois places à la fois.
  #
  # Diagnostic établi le 24/09 : l'hôte est PARFAITEMENT JOIGNABLE depuis une
  # connexion résidentielle (HTTP 301 en 0,7 s, mêmes adresses IP que celles
  # que le runner tente). Il expire uniquement depuis GitHub Actions. Une
  # expiration — et non un 403 — sur toutes les adresses, pendant trois mois,
  # alors que le service est debout : la source filtre les plages
  # d'hébergeurs. Réessayer n'y changera rien.
  #
  # Ce qui a décidé la coupure, ce n'est pas l'échec lui-même mais son BRUIT :
  # trois runs rouges par jour ouvré, soit ~780 par an, au milieu desquels la
  # panne intraday du 24/09 (31 échecs, une vraie régression) était bien plus
  # dure à voir. Une alerte permanente n'alerte plus personne.
  #
  # L'affichage, lui, ne ment pas : `AfricanIndicesCard` détecte la péremption
  # au-delà de 4 jours (`lib/african/fraicheur.ts`), date les valeurs et les
  # atténue. Le site dit donc « données du 3 juillet 2026 », pas « fin de
  # séance ».
  #
  # Pour relancer la collecte, il faudra une route qui ne parte pas d'un
  # centre de données (proxy, exécution planifiée ailleurs) ou une autre
  # source. Remettre le `schedule` sans l'un des deux ne fera que rallumer le
  # bruit.
  workflow_dispatch: {} # déclenchement manuel conservé, pour tester une correction

concurrency:
  group: african-indices
  cancel-in-progress: false

# Jeton GITHUB_TOKEN réduit au minimum : ce workflow ne fait que lire le dépôt.
permissions:
  contents: read

jobs:
  african:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Crawl-delay 60 s entre sources : ~3 min par tentative
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install scraper deps
        working-directory: scraper
        run: npm install

      - name: Run african indices (with retry)
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Le délai entre tentatives ne descend pas sous le Crawl-delay (60 s) du site.
          MAX_RETRIES=2
          RETRY_DELAY=60
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES..."
            if npx tsx src/index.ts african; then
              echo "✅ African indices scrape succeeded"
              exit 0
            else
              if [ $attempt -lt $MAX_RETRIES ]; then
                echo "⚠️ Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            fi
          done
          echo "❌ African indices scrape failed after $MAX_RETRIES attempts"
          exit 1
