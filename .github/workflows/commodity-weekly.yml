name: Commodity Weekly Generator

on:
  schedule:
    # Vendredi 17h30 WAT (= 16h30 UTC)
    - cron: "30 16 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (sans écriture Supabase ni HTML)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    name: Générer l'article hebdomadaire matières premières
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install --upgrade pip
          pip install yfinance openai requests pandas openpyxl

      - name: Générer l'article
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python commodity_weekly_generator.py ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Commiter et pousser l'article HTML
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/weekly/
          if git diff --cached --quiet; then
            echo "Aucun fichier nouveau à commiter"
          else
            SLUG=$(ls frontend/public/weekly/*.html | head -1 | xargs basename .html 2>/dev/null || echo "weekly")
            git commit -m "feat(weekly): article matières premières BRVM $(date +'S%V/%Y') [bot]"
            git push origin main
          fi

      - name: Upload article HTML (artefact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commodity-weekly-html
          path: frontend/public/weekly/
          retention-days: 30
          if-no-files-found: ignore
