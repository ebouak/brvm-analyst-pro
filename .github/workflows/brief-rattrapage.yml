name: Brief — rattrapage de découverte

# Reprend l'envoi de découverte là où il s'est arrêté.
#
# POURQUOI IL EXISTE. Le 2026-09-25, l'envoi à tous les comptes s'est
# interrompu à mi-parcours : le quota QUOTIDIEN de Resend était épuisé
# (429 daily_quota_exceeded). 72 personnes ont reçu le brief, 58 non. Le quota
# se réarme chaque jour ; ce workflow reprend le lendemain matin, avant toute
# autre consommation.
#
# IL S'ÉTEINT SEUL. La première étape compte les destinataires restants ; à
# zéro, tout le reste est sauté et le job se termine en quelques secondes.
# Une fois les 130 servis, ce fichier ne fait plus rien — il peut alors être
# supprimé, mais le laisser ne coûte presque rien.
#
# AUCUNE PUBLICATION. Ni Facebook, ni TikTok, ni Telegram, ni la landing : ce
# workflow ne fait qu'envoyer des emails. La vidéo est générée uniquement
# parce que le brief se compose à partir de `seance.json`, qui en sort — une
# seule lecture nourrit les images, la voix et le texte, et on ne crée pas une
# seconde source pour économiser dix minutes.

on:
  schedule:
    # 08:00 UTC — 08:00 à Abidjan, 10:00 à Paris. Tôt dans la journée pour
    # disposer du quota entier, avant les alertes et le brief du soir.
    - cron: '0 8 * * *'
  workflow_dispatch: {}

concurrency:
  # Jamais en parallèle de la vidéo du soir : les deux écrivent dans
  # `campagne_envois`, et deux exécutions simultanées pourraient toutes deux
  # lire « pas encore servi » pour la même adresse avant que l'une n'écrive.
  group: video-seance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: video
    env:
      VIDEO_OUT: ${{ github.workspace }}/video-out

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Deux lectures, pas de génération : inutile de dépenser dix minutes de
      # calcul pour découvrir qu'il ne reste personne.
      - name: Reste-t-il des destinataires ?
        id: reste
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node brief-reste.mjs --campagne=brief-decouverte

      - uses: actions/setup-python@v5
        if: steps.reste.outputs.nombre != '0'
        with:
          python-version: '3.12'

      - name: Installer ffmpeg et les polices
        if: steps.reste.outputs.nombre != '0'
        run: |
          ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: Installer edge-tts
        if: steps.reste.outputs.nombre != '0'
        run: python -m pip install --quiet edge-tts

      - name: Installer les dépendances
        if: steps.reste.outputs.nombre != '0'
        run: npm install

      - name: Installer Chromium
        if: steps.reste.outputs.nombre != '0'
        run: npx playwright install chromium --with-deps

      # La séance de la veille suffit : `seance_recente` tolère 5 jours, et un
      # samedi matin la clôture du vendredi a zéro jour d'âge.
      - name: Générer la fiche de séance
        if: steps.reste.outputs.nombre != '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node genere.mjs

      # `continue-on-error` VOLONTAIREMENT absent : au-delà de 10 % d'échecs le
      # script sort en erreur, et il faut que cela se voie. Un demi-envoi resté
      # vert est exactement ce qui a produit cet incident.
      - name: Envoyer aux destinataires restants
        if: steps.reste.outputs.nombre != '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_EMAIL_FROM: ${{ secrets.ALERTS_EMAIL_FROM }}
        run: node brief-envoi.mjs --decouverte --envoyer
