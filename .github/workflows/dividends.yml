name: Weekly Dividends Ingestion

env:
  SCRAPER_TRIGGER: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}

on:
  schedule:
    # Samedi matin pour capturer les annonces de dividendes de la semaine.
    # 09:00 UTC = 10:00 UTC+1.
    - cron: '0 9 * * 6'
  workflow_dispatch: {}

concurrency:
  group: dividends-ingestion
  cancel-in-progress: false

# Jeton GITHUB_TOKEN réduit au minimum : ce workflow ne fait que lire le dépôt.
permissions:
  contents: read

jobs:
  dividends:
    runs-on: ubuntu-latest
    # 20 min : le calendrier officiel passe deux fois (test puis écriture), à 10 s
    # entre deux requêtes vers brvm.org (robots.txt, Crawl-delay 10).
    timeout-minutes: 20
    strategy:
      max-parallel: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install scraper deps
        working-directory: scraper
        run: npm ci

      # Test à blanc du calendrier officiel : il décide du repli. RichBourse refuse
      # les robots, il n'est donc interrogé que si le calendrier est KO.
      - name: Tester le calendrier officiel (à blanc)
        id: calendrier_test
        continue-on-error: true
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx src/index.ts dividends:calendrier

      - name: Run dividends ingestion with retry
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOG_LEVEL: info
          RICHBOURSE_REPLI: ${{ steps.calendrier_test.outcome == 'failure' && '1' || '0' }}
        run: |
          MAX_RETRIES=2
          RETRY_DELAY=30
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES..."
            if npm run dividends; then
              echo "✅ Dividends ingestion succeeded"
              exit 0
            else
              if [ $attempt -lt $MAX_RETRIES ]; then
                echo "⚠️ Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            fi
          done
          echo "❌ Dividends ingestion failed after $MAX_RETRIES attempts"
          exit 1

      - name: Verify dividends written
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        if: success()
        run: npx tsx scripts/verify-data.ts dividends

      # Calendrier officiel BRVM (dates de détachement, brut/net). APRÈS
      # « dividends » : le calendrier est le dernier à écrire, et plus aucune
      # autre source ne l'écrase (runDividends.SOURCES_REFERENCE).
      # Calendrier KO : le Bulletin officiel de la BRVM prend le relais, et le repli
      # se voit sur la page du run.
      - name: Bulletin officiel (repli si calendrier KO)
        if: steps.calendrier_test.outcome == 'failure'
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "::warning title=Dividendes::calendrier officiel KO, repli sur le Bulletin officiel et RichBourse"
          npx tsx src/index.ts dividends:boc --ecrire

      - name: Calendrier officiel des dividendes
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOG_LEVEL: info
        run: npx tsx src/index.ts dividends:calendrier --ecrire

      - name: Vérifier le calendrier en base
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/verify-data.ts dividends-calendrier

      - name: Notify failure on Slack
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"⚠️ Weekly Dividends Ingestion FAILED after 2 retries at $(date -u +'%H:%M UTC'). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi

  # Flottant (brvm_instruments), depuis les fiches société Sika Finance.
  #
  # Remplace le job `details` (RichBourse), retiré le 2026-11-06 : RichBourse
  # répond 403 « extraction automatique non autorisée », et le job restait vert
  # sans rien écrire. Ne pas le rétablir ni contourner ce refus sans leur accord.
  # `vol_moyen_30j` n'a plus de source : sans consommateur, elle n'est pas remplacée.
  #
  # Hebdomadaire : le flottant ne bouge qu'aux opérations sur titres. Environ 50
  # requêtes, une par seconde. Rouge si moins de la moitié des valeurs sont écrites.
  flottant:
    runs-on: ubuntu-latest
    needs: dividends
    if: always() # indépendant du succès de l'ingestion des dividendes
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install scraper deps
        working-directory: scraper
        run: npm ci
      - name: Run flottant
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOG_LEVEL: info
        run: npx tsx src/index.ts flottant

